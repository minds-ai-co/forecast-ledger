<title id="t3">Minds Mosaic error by topic and week</title>
<desc id="d3">Minds Mosaic average forecast error (TVD, 0 is perfect) by topic and result release week. Combined over all 18 scored surveys: 0.084. Elections and politics: 0.020 over 9 surveys. Consumer sentiment: 0.037 over 5 surveys. Viewing and media: 0.371 over 3 surveys. Purchases and sales: 0.036 over 1 survey.</desc>
